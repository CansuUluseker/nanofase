[workspace]
authors = ["Sam Harrison <samharrison.xg@gmail.com>"]
channels = ["conda-forge", "samharrison7"]
name = "nanofase"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build-docs = "jupyter-book build docs/"
serve-docs = { cmd = "python -m http.server 8000 --directory docs/_build/html", depends-on = ["build-docs"] }

[dependencies]
fpm = ">=0.13.0,<0.14"
gfortran = ">=16.2.0,<16.3"
libnetcdf = ">=4.10.1,<5"
netcdf-fortran = ">=4.6.4,<5"
gxx = ">=16.2.0,<16.3"
gcc = ">=16.2.0,<16.3"
nfdata = ">=0.3.0,<0.4"
python = ">=3.14.10,<3.15"
jupyter-book = "<2"
matplotlib = ">=3.11.2,<4"
numpy = ">=2.5.4,<3"
sphinxcontrib-mermaid = ">=2.1.1,<3"
ipykernel = ">=7.4.0,<8"
